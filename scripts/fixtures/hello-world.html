<p>你好，欢迎来到我的博客。</p>
<h2 id="为什么要写博客">为什么要写博客</h2>
<p>写作是最好的学习方式之一：把一件事讲清楚，往往比“感觉自己会了”难得多。这个博客就是我的自留地，用来记录学习过程、实践心得和一些零碎的思考。</p>
<h2 id="这里会写什么">这里会写什么</h2>
<ul>
<li><strong>技术学习笔记</strong>：正在学习的技术，踩过的坑，总结的方法</li>
<li><strong>项目实践记录</strong>：包括这个博客本身的搭建过程</li>
<li><strong>读书与思考</strong>：不限于技术</li>
</ul>
<h2 id="关于更新频率">关于更新频率</h2>
<p>目标是每周至少更新一篇。不追求数量，坚持比爆发更重要。</p>
<p>如果你有什么想交流的，欢迎在文章下方留言（评论功能即将上线）。</p>
